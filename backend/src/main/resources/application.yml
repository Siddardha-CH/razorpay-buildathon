spring:
  application:
    name: recoup-backend
  datasource:
    url: jdbc:h2:file:./data/recoupdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

app:
  api-key: ${RECOUP_API_KEY:dev-local-key}
  quiet-hour-start: 21
  quiet-hour-end: 8
  cors-allowed-origin: ${RECOUP_FRONTEND_ORIGIN:http://localhost:5173}

groq:
  api-key: ${GROQ_API_KEY:}
  model: ${GROQ_MODEL:llama-3.3-70b-versatile}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
